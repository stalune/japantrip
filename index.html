<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Japan Journey Planner — AI-Powered Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1410;
    --ink2: #4a3f35;
    --ink3: #8a7a6e;
    --paper: #faf8f3;
    --paper2: #f2ede4;
    --paper3: #e8e0d3;
    --red: #c0392b;
    --red2: #e8a89e;
    --gold: #c9922a;
    --gold2: #f0d9a8;
    --green: #2d6a4f;
    --green2: #a8d5bc;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.7;
  }
  header {
    background: var(--ink);
    color: var(--paper);
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 32px 40px;
    position: relative;
    z-index: 1;
  }
  .header-kana {
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--red2);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  header h1 em { color: var(--red2); font-style: italic; }
  header p.subtitle {
    color: rgba(250,248,243,0.65);
    font-size: 14px;
    font-weight: 300;
    max-width: 480px;
  }
  .header-deco {
    position: absolute;
    right: -40px;
    top: -20px;
    font-size: 220px;
    opacity: 0.04;
    line-height: 1;
    user-select: none;
    pointer-events: none;
    font-family: serif;
  }
  main { max-width: 900px; margin: 0 auto; padding: 40px 32px 80px; }
  .form-card {
    background: #fff;
    border: 1px solid var(--paper3);
    border-radius: 4px;
    padding: 36px 40px;
    margin-bottom: 40px;
    box-shadow: 0 2px 20px rgba(26,20,16,0.06);
  }
  .form-card h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 24px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .form-card h2::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--paper3);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink3);
  }
  input, select, textarea {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--paper3);
    border-radius: 3px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--ink2);
    background: #fff;
  }
  textarea { resize: vertical; min-height: 90px; }
  .chip-area {
    background: var(--paper);
    border: 1px solid var(--paper3);
    border-radius: 3px;
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    min-height: 48px;
    cursor: text;
  }
  .chip {
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    padding: 4px 10px 4px 12px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .chip-remove {
    cursor: pointer;
    opacity: 0.5;
    font-size: 14px;
    line-height: 1;
    background: none;
    border: none;
    color: inherit;
    padding: 0;
  }
  .chip-remove:hover { opacity: 1; }
  .chip-input {
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    flex: 1;
    min-width: 120px;
    padding: 2px 4px;
  }
  .style-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .style-option { display: none; }
  .style-label {
    border: 1px solid var(--paper3);
    border-radius: 3px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 12px;
    color: var(--ink2);
    transition: all 0.15s;
    user-select: none;
    background: var(--paper);
    display: block;
  }
  .style-label span { display: block; font-size: 20px; margin-bottom: 4px; }
  .style-option:checked + .style-label {
    border-color: var(--ink);
    background: var(--ink);
    color: var(--paper);
  }
  .btn-generate {
    margin-top: 28px;
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 16px 32px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-generate:hover { opacity: 0.9; }
  .btn-generate:active { transform: scale(0.99); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
  #output-section { display: none; }
  #output-section.visible { display: block; }
  .output-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .output-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 400;
  }
  .btn-regenerate {
    background: none;
    border: 1px solid var(--paper3);
    border-radius: 3px;
    padding: 8px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn-regenerate:hover { border-color: var(--ink); color: var(--ink); }
  .day-cards { display: flex; flex-direction: column; gap: 24px; }
  .day-card {
    background: #fff;
    border: 1px solid var(--paper3);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(26,20,16,0.04);
  }
  .day-card-head {
    background: var(--ink);
    color: var(--paper);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .day-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem;
    font-weight: 400;
    line-height: 1;
    opacity: 0.3;
  }
  .day-info { flex: 1; }
  .day-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--red2);
    margin-bottom: 2px;
  }
  .day-title { font-size: 17px; font-weight: 500; }
  .day-meta { font-size: 12px; opacity: 0.55; margin-top: 1px; }
  .day-card-body { padding: 24px 28px; }
  .stop-list { list-style: none; }
  .stop-item {
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 0 16px;
    position: relative;
    padding-bottom: 20px;
  }
  .stop-item:last-child { padding-bottom: 0; }
  .stop-item::before {
    content: '';
    position: absolute;
    left: 24px;
    top: 28px;
    bottom: 0;
    width: 1px;
    background: var(--paper3);
  }
  .stop-item:last-child::before { display: none; }
  .stop-time {
    font-size: 12px;
    color: var(--ink3);
    font-weight: 500;
    text-align: right;
    padding-top: 6px;
  }
  .stop-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--ink);
    position: absolute;
    left: 20px;
    top: 8px;
  }
  .stop-must .stop-dot { background: var(--red); }
  .stop-hotel .stop-dot { background: var(--gold); }
  .stop-content { padding-left: 16px; padding-top: 2px; }
  .stop-name { font-weight: 500; font-size: 15px; line-height: 1.3; margin-bottom: 3px; }
  .stop-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    margin-bottom: 5px;
    margin-right: 4px;
  }
  .tag-must { background: var(--red2); color: var(--red); }
  .tag-hotel { background: var(--gold2); color: var(--gold); }
  .tag-food { background: var(--green2); color: var(--green); }
  .tag-transport { background: var(--paper2); color: var(--ink3); }
  .stop-desc { font-size: 13px; color: var(--ink2); line-height: 1.6; }
  .stop-duration {
    font-size: 11px;
    color: var(--ink3);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stop-duration::before { content: '⏱'; font-size: 10px; }
  .summary-bar {
    background: var(--paper2);
    border: 1px solid var(--paper3);
    border-radius: 3px;
    padding: 16px 24px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
    text-align: center;
  }
  .summary-stat small {
    display: block;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 2px;
  }
  .summary-stat strong { font-size: 18px; font-weight: 500; }
  .tips-card {
    background: var(--ink);
    color: var(--paper);
    border-radius: 4px;
    padding: 28px 32px;
    margin-top: 28px;
  }
  .tips-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 400;
    margin-bottom: 16px;
    color: var(--gold2);
  }
  .tips-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .tips-list li { font-size: 13px; color: rgba(250,248,243,0.8); padding-left: 16px; position: relative; }
  .tips-list li::before { content: '—'; position: absolute; left: 0; color: var(--red2); }
  .loading-overlay { text-align: center; padding: 60px 32px; color: var(--ink3); }
  .loading-spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--paper3);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; font-style: italic; }
  .loading-messages { font-size: 12px; color: var(--ink3); margin-top: 8px; }
  .stream-raw {
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .error-box {
    background: #fff0ef;
    border: 1px solid var(--red2);
    border-radius: 3px;
    padding: 16px 20px;
    color: var(--red);
    font-size: 13px;
  }
  .btn-print {
    background: none;
    border: 1px solid var(--paper3);
    border-radius: 3px;
    padding: 8px 18px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-print:hover { border-color: var(--ink); color: var(--ink); }
  @media (max-width: 640px) {
    main { padding: 24px 16px 60px; }
    .form-card { padding: 24px 20px; }
    .form-grid { grid-template-columns: 1fr; }
    .style-grid { grid-template-columns: repeat(2, 1fr); }
    .summary-bar { grid-template-columns: 1fr; gap: 8px; }
    .day-card-head { padding: 12px 16px; }
    .day-card-body { padding: 16px; }
    .stop-item { grid-template-columns: 48px 1fr; }
  }
  @media print {
    header, .form-card, .btn-regenerate, .btn-print { display: none; }
    body { background: #fff; }
    .day-card { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <div class="header-deco">旅</div>
  <div class="header-inner">
    <p class="header-kana">AI-POWERED JAPAN TRAVEL PLANNER</p>
    <h1>Plan your perfect<br /><em>Japanese journey</em></h1>
    <p class="subtitle">Tell us your dates, dream destinations, and travel style — our AI crafts a detailed itinerary with travel times and local insights.</p>
  </div>
</header>

<main>
  <div class="form-card">
    <h2>Your Trip Details</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Start Date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="form-group">
        <label>End Date</label>
        <input type="date" id="endDate" />
      </div>
      <div class="form-group">
        <label>Arriving From / Home City</label>
        <input type="text" id="homeCity" placeholder="e.g. New York, London, Sydney" />
      </div>
      <div class="form-group">
        <label>Number of Travelers</label>
        <select id="numTravelers">
          <option value="1">Solo traveler</option>
          <option value="2" selected>2 people</option>
          <option value="3-4">3–4 people</option>
          <option value="5+">5+ people / group</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Hotel / Base(s) in Japan <span style="font-size:10px;opacity:0.5;text-transform:none;letter-spacing:0">(optional)</span></label>
        <input type="text" id="hotelName" placeholder="e.g. Shinjuku, Tokyo for nights 1-4 · Arashiyama, Kyoto for nights 5-7" />
      </div>
      <div class="form-group full">
        <label>Must-Visit Places <span style="font-size:10px;opacity:0.5;text-transform:none;letter-spacing:0">— press Enter to add each</span></label>
        <div class="chip-area" id="chipArea" onclick="document.getElementById('chipInput').focus()">
          <input class="chip-input" id="chipInput" type="text" placeholder="Type a place and press Enter…" />
        </div>
      </div>
      <div class="form-group full">
        <label>Travel Style</label>
        <div class="style-grid">
          <div><input type="checkbox" class="style-option" id="s1" value="culture" /><label class="style-label" for="s1"><span>⛩️</span>Culture &amp; History</label></div>
          <div><input type="checkbox" class="style-option" id="s2" value="nature" /><label class="style-label" for="s2"><span>🌸</span>Nature &amp; Outdoors</label></div>
          <div><input type="checkbox" class="style-option" id="s3" value="food" /><label class="style-label" for="s3"><span>🍜</span>Food &amp; Drink</label></div>
          <div><input type="checkbox" class="style-option" id="s4" value="shopping" /><label class="style-label" for="s4"><span>🛍️</span>Shopping &amp; City</label></div>
          <div><input type="checkbox" class="style-option" id="s5" value="relaxation" /><label class="style-label" for="s5"><span>♨️</span>Onsen &amp; Relax</label></div>
          <div><input type="checkbox" class="style-option" id="s6" value="anime" /><label class="style-label" for="s6"><span>🎌</span>Anime &amp; Pop Culture</label></div>
          <div><input type="checkbox" class="style-option" id="s7" value="luxury" /><label class="style-label" for="s7"><span>💎</span>Luxury &amp; Refined</label></div>
          <div><input type="checkbox" class="style-option" id="s8" value="budget" /><label class="style-label" for="s8"><span>💴</span>Budget-Friendly</label></div>
        </div>
      </div>
      <div class="form-group full">
        <label>Any Other Notes <span style="font-size:10px;opacity:0.5;text-transform:none;letter-spacing:0">(dietary needs, mobility, special interests, etc.)</span></label>
        <textarea id="notes" placeholder="e.g. We're vegetarian. One member uses a wheelchair. We love jazz bars."></textarea>
      </div>
    </div>
    <button class="btn-generate" id="generateBtn" onclick="generateItinerary()">
      <span id="btnText">✦ Generate My Itinerary</span>
    </button>
  </div>

  <section id="output-section">
    <div class="output-header">
      <h2 id="outputTitle">Your Japan Itinerary</h2>
      <div style="display:flex;gap:10px;">
        <button class="btn-print" onclick="window.print()">🖨 Print / Save PDF</button>
        <button class="btn-regenerate" onclick="generateItinerary()">↺ Regenerate</button>
      </div>
    </div>
    <div id="outputContent"></div>
  </section>
</main>

<script>
const mustVisit = [];
const chipInput = document.getElementById('chipInput');
const chipArea  = document.getElementById('chipArea');

chipInput.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ',') && chipInput.value.trim()) {
    e.preventDefault();
    addChip(chipInput.value.trim());
    chipInput.value = '';
  }
  if (e.key === 'Backspace' && chipInput.value === '' && mustVisit.length) {
    removeChip(mustVisit.length - 1);
  }
});

function addChip(text) {
  const idx = mustVisit.length;
  mustVisit.push(text);
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = text + ' <button class="chip-remove" onclick="removeChip(' + idx + ')">×</button>';
  chipArea.insertBefore(chip, chipInput);
}

function removeChip(idx) {
  mustVisit.splice(idx, 1);
  renderChips();
}

function renderChips() {
  document.querySelectorAll('.chip').forEach(c => c.remove());
  mustVisit.forEach((t, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = t + ' <button class="chip-remove" onclick="removeChip(' + i + ')">×</button>';
    chipArea.insertBefore(chip, chipInput);
  });
}

function calcDays(start, end) {
  if (!start || !end) return null;
  const d = (new Date(end) - new Date(start)) / 86400000;
  return d > 0 ? d + 1 : null;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

async function generateItinerary() {
  const startDate    = document.getElementById('startDate').value;
  const endDate      = document.getElementById('endDate').value;
  const homeCity     = document.getElementById('homeCity').value.trim();
  const hotelName    = document.getElementById('hotelName').value.trim();
  const numTravelers = document.getElementById('numTravelers').value;
  const notes        = document.getElementById('notes').value.trim();
  const styles       = Array.from(document.querySelectorAll('.style-option:checked')).map(c => c.value);
  const days         = calcDays(startDate, endDate);

  if (!startDate || !endDate || !days) { alert('Please select your travel dates.'); return; }
  if (days > 30) { alert('Please select a trip of 30 days or fewer.'); return; }

  const btn     = document.getElementById('generateBtn');
  const btnText = document.getElementById('btnText');
  btn.disabled  = true;
  btnText.textContent = '✦ Planning your journey…';

  const outputSection = document.getElementById('output-section');
  const outputContent = document.getElementById('outputContent');
  const outputTitle   = document.getElementById('outputTitle');

  outputSection.classList.add('visible');
  outputTitle.textContent = days + '-Day Japan Itinerary';
  outputContent.innerHTML = '<div class="loading-overlay"><div class="loading-spinner"></div><p class="loading-text">Crafting your personalized journey…</p><p class="loading-messages">Calculating travel times · Planning routes · Finding local gems</p></div>';
  outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const promptParts = [
    'Please create a detailed ' + days + '-day Japan itinerary.',
    'Travel dates: ' + formatDate(startDate) + ' to ' + formatDate(endDate) + ' (' + days + ' days).',
    homeCity     ? 'Traveler is arriving from: ' + homeCity + '.' : '',
    'Number of travelers: ' + numTravelers + '.',
    hotelName    ? 'Accommodation/base: ' + hotelName + '.' : '',
    mustVisit.length ? 'Must-visit places (prioritize these): ' + mustVisit.join(', ') + '.' : '',
    styles.length    ? 'Travel style preferences: ' + styles.join(', ') + '.' : '',
    notes        ? 'Additional notes: ' + notes : '',
  ].filter(Boolean).join('\n');

  const SYSTEM_PROMPT = `You are an expert Japan travel planner with deep knowledge of Japanese geography, transportation, culture, and tourism. You create detailed, practical, and inspiring itineraries for foreign visitors.

Respond with a JSON object only — no markdown, no backticks, no explanation. Use this exact structure:

{
  "summary": {
    "title": "evocative trip title",
    "overview": "2-3 sentence overview",
    "totalDistance": "e.g. ~800 km",
    "mainRegions": ["Tokyo", "Kyoto"],
    "tips": ["tip1", "tip2", "tip3", "tip4", "tip5"]
  },
  "days": [
    {
      "dayNumber": 1,
      "date": "Monday, Oct 14",
      "theme": "short poetic theme",
      "region": "Tokyo",
      "stops": [
        {
          "time": "9:00",
          "name": "Place Name",
          "type": "attraction",
          "duration": "2 hours",
          "description": "1-2 sentence description with practical tips",
          "isMust": false,
          "isHotel": false
        }
      ],
      "dailyNote": "1 sentence practical tip for the day"
    }
  ]
}

Rules:
- type must be one of: must-visit, hotel, food, transport, attraction, activity
- Include travel time between stops as type transport
- Each day: 5-8 stops including at least 1 meal (type food)
- Include must-visit places prominently, mark isMust true
- Mark hotel stops isHotel true
- Factor hotel location to minimize backtracking
- For multi-city trips include travel day logistics
- Return ONLY valid JSON, nothing else`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
  'Content-Type': 'application/json',
  'x-api-key': 'celestsitter-onboarding-api-key',
  'anthropic-version': '2023-06-01',
  'anthropic-dangerous-direct-browser-calls': 'true',
  'anthropic-beta': 'interstitial-1',
},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        stream: true,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: promptParts }],
      }),
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error && err.error.message ? err.error.message : 'API error ' + response.status);
    }

    outputContent.innerHTML = '<div class="stream-raw" id="streamRaw"></div>';
    const streamEl = document.getElementById('streamRaw');
    let fullText = '';
    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          if (json.type === 'content_block_delta' && json.delta && json.delta.text) {
            fullText += json.delta.text;
            streamEl.textContent = fullText;
          }
        } catch(e) {}
      }
    }

    outputContent.innerHTML = renderItinerary(fullText, { days: days, mustVisit: mustVisit });

  } catch (err) {
    outputContent.innerHTML = '<div class="error-box">⚠️ ' + err.message + '<br/><small>Please check your API key and try again.</small></div>';
  }

  btn.disabled = false;
  btnText.textContent = '✦ Generate My Itinerary';
}

function renderItinerary(rawText, opts) {
  const days      = opts.days;
  const mustVisit = opts.mustVisit;
  let data;
  try {
    const clean = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
    data = JSON.parse(clean);
  } catch(e) {
    return '<div style="background:#fff;border:1px solid var(--paper3);border-radius:4px;padding:32px;white-space:pre-wrap;font-size:14px;line-height:1.8;">' + rawText + '</div>';
  }

  const s        = data.summary || {};
  const daysList = data.days    || [];
  let html = '';

  html += '<div class="summary-bar">';
  html += '<div class="summary-stat"><small>Duration</small><strong>' + days + ' Days</strong></div>';
  html += '<div class="summary-stat"><small>Regions</small><strong>' + ((s.mainRegions || []).join(' · ') || '—') + '</strong></div>';
  html += '<div class="summary-stat"><small>Total Distance</small><strong>' + (s.totalDistance || '—') + '</strong></div>';
  html += '</div>';

  if (s.overview) {
    html += '<p style="font-size:15px;color:var(--ink2);line-height:1.8;margin-bottom:28px;">' + s.overview + '</p>';
  }

  html += '<div class="day-cards">';
  daysList.forEach(function(day) {
    const stops = day.stops || [];
    let stopsHtml = '';

    stops.forEach(function(stop) {
      const isMust     = stop.isMust || mustVisit.some(function(m){ return stop.name.toLowerCase().indexOf(m.toLowerCase()) !== -1; });
      const isHotel    = stop.isHotel || stop.type === 'hotel';
      const isFood     = stop.type === 'food';
      const isTransport= stop.type === 'transport';

      let tags = '';
      if (isMust)      tags += '<span class="stop-tag tag-must">Must-visit</span>';
      if (isHotel)     tags += '<span class="stop-tag tag-hotel">Hotel</span>';
      if (isFood)      tags += '<span class="stop-tag tag-food">Food</span>';
      if (isTransport) tags += '<span class="stop-tag tag-transport">Transit</span>';

      stopsHtml += '<li class="stop-item ' + (isMust ? 'stop-must' : '') + ' ' + (isHotel ? 'stop-hotel' : '') + '">';
      stopsHtml += '<div class="stop-time">' + (stop.time || '') + '</div>';
      stopsHtml += '<div class="stop-dot"></div>';
      stopsHtml += '<div class="stop-content">';
      stopsHtml += '<div class="stop-name">' + stop.name + '</div>';
      if (tags) stopsHtml += '<div>' + tags + '</div>';
      if (stop.description) stopsHtml += '<div class="stop-desc">' + stop.description + '</div>';
      if (stop.duration)    stopsHtml += '<div class="stop-duration">' + stop.duration + '</div>';
      stopsHtml += '</div></li>';
    });

    const dayNum = String(day.dayNumber).padStart(2, '0');
    html += '<div class="day-card">';
    html += '<div class="day-card-head">';
    html += '<div class="day-number">' + dayNum + '</div>';
    html += '<div class="day-info">';
    html += '<div class="day-label">Day ' + day.dayNumber + '</div>';
    html += '<div class="day-title">' + (day.theme || day.region || '') + '</div>';
    html += '<div class="day-meta">' + (day.date || '') + ' · ' + (day.region || '') + '</div>';
    html += '</div></div>';
    html += '<div class="day-card-body">';
    html += '<ul class="stop-list">' + stopsHtml + '</ul>';
    if (day.dailyNote) {
      html += '<p style="margin-top:16px;font-size:12px;color:var(--ink3);font-style:italic;border-top:1px solid var(--paper3);padding-top:12px;">💡 ' + day.dailyNote + '</p>';
    }
    html += '</div></div>';
  });
  html += '</div>';

  if (s.tips && s.tips.length) {
    html += '<div class="tips-card"><h3>Local Tips &amp; Practical Notes</h3><ul class="tips-list">';
    s.tips.forEach(function(t){ html += '<li>' + t + '</li>'; });
    html += '</ul></div>';
  }

  return html;
}

window.addEventListener('DOMContentLoaded', function() {
  const now   = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() + 1, 15);
  const end   = new Date(now.getFullYear(), now.getMonth() + 1, 22);
  document.getElementById('startDate').value = start.toISOString().split('T')[0];
  document.getElementById('endDate').value   = end.toISOString().split('T')[0];
});
</script>
</body>
